  - title: Mikael Yamiosei
    image: /images/uploads/6C95A130-EB71-49D0-9F29-53F8EFA9CFCB.png
    description: |-
      Founder and Lead Journalist (25)

      Mikael (Mizuki) Yamiosei is a Twenty-Five-Year-old Japanese European living in Yerevan Armenia. His goal is to give Armenians a voice, by listening first and reporting on firsthand experiences, sharing his findings with the world to better give Armenia the Representation it deserves. He moved here in 2021 and began developing IRCNA in late 2024. He officially founded IRCNA in late 2025; as of October 2026, he is the sole independent journalist, editor, coder, photographer, videographer and representative for IRCNA, but he plans to change this soon by hiring volunteers.
