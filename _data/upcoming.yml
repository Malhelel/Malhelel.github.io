heading: 'ANNOUNCEMENT: SCALING BACK'
body: |-
  <h2>NOTICE: THIS WEBSITE WILL NOT BE ACTIVE – IRCNA </h2>

  <blockquote style="border-left: 4px solid #e44; margin: 1.5em 0; padding: 0.8em 1.2em; background: #fafaf;">

  I need to be honest with you all.

  When I started IRCNA, I made a commitment: to deliver independent, community-first journalism from Armenia, in English, at a standard you deserve. I've always run this platform entirely on my own, and I've paid for everything out of my own pocket — hosting, equipment, travel for reporting, all of it.

  But right now, I can no longer do that consistently.

  The cost of living in Armenia has risen sharply. Bills, rent, groceries — everything has gone up, and I've found myself with less and less money able to invest back into IRCNA. Throughout the entire month of July, I tried to recruit and hire journalists, photographers, and editors to help lighten the load. Despite my efforts, no one was available or able to commit, or asked for an absurd amount of money. The reality is that keeping IRCNA running at the frequency and standard I've held myself to is no longer financially possible for me alone.

  So, going forward, IRCNA will restructure into a periodical blog format. All existing content will remain on our platforms — nothing is being removed. But new articles will now be published only when I am personally able to afford to produce them.

  I want to apologise for any inconvenience this may cause you as a reader. This is not the path I wanted to take, but it is the honest one I can manage right now.

  Thank you — genuinely — for every article you've read, every post you've shared, every tip you've sent. You've made IRCNA real, and that will never change!!

  With gratitude,

  Mikael Yamiosei

  Founder, IRCNA

  </blockquote>
  For any Questions, Comments, or Concerns Please reach me via Email: Mikael.Yamiosei@gmail.com [NOTE: ALL EMAILS WILL BE REPLIED TO AFTER JULY 15TH]
