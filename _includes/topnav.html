<style>
	/* Keep the top navigation in document flow so page content cannot scroll beneath it. */
	#topnav {
		position: relative !important;
		top: auto !important;
		z-index: auto !important;
	}

	/* The homepage adds .scrolled; neutralize its fixed-height clipping and spacing changes. */
	#topnav.scrolled {
		height: auto !important;
		min-height: 40px !important;
		padding: 0.2em 1.5em !important;
		overflow: visible !important;
	}

	#topnav.scrolled .topnav-slogan,
	#topnav.scrolled .topnav-menu li a {
		font-size: inherit !important;
	}

	#topnav.scrolled .topnav-logo img {
		height: 20px !important;
	}

	/* On small screens the sidebar is a full-height drawer, not a panel below the nav. */
	@media screen and (max-width: 1280px) {
		#sidebar {
			top: 0 !important;
			height: 100% !important;
		}
	}
</style>

<nav id="topnav">
  <div class="topnav-logo">
    <a href="index.html" style="display:flex; align-items:center; text-decoration:none; color:#fff;">
      {% if site.data.homepage.logo_image %}
        <img src="{{ site.data.homepage.logo_image }}" alt="IRCNA logo" style="height:20px; margin-right:0.5em;" />
      {% endif %}
      <span class="topnav-slogan">{{ site.data.homepage.sidebar_slogan }} in Armenia</span>
    </a>
  </div>
  <ul class="topnav-menu">
    {% for link in site.data.topnav.links %}
    <li><a href="{{ link.url }}">{{ link.label }}</a></li>
    {% endfor %}
  </ul>
  <div class="topnav-social">
    {{ site.data.homepage.social_icons_html }}
  </div>
</nav>
